        <h1>我的第一篇自建博客文章</h1>
        <p class="summary">由于用Hexo有点预制的感觉，所以决定从零开始搓一个轻量化的、好维护的小网站。</p>
      </header>

      <p>我想要一个更简单、更可控的个人站点。于是含泪删掉捣鼓半天的Hexo文件，只保留 GitHub Pages 需要的静态文件。</p>
      <p>以后添加文章时，只需要复制这篇文章的 HTML 文件，修改标题、日期和正文，再把入口加到首页和文章列表里。</p>

      <h2>下一步</h2>
      <p>我可以继续加入项目展示、主题切换，总之等我想起来搞吧。</p>
